spring.application.name=Insurance-Backend

# Datasource configuration (local development defaults, overridden by Kubernetes env vars)
spring.datasource.url=jdbc:postgresql://localhost:5433/insurance_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Configuration (local development default, overridden by Kubernetes env vars)
spring.kafka.bootstrap-servers=localhost:9092
