name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'insurance-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'insurance-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compile-and-validate:
    name: 1. Compile & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'insurance-frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd insurance-frontend
          pnpm install --frozen-lockfile

      - name: Build Angular app
        run: |
          cd insurance-frontend
          pnpm run build

  docker-publish:
    name: 2. Build & Publish Docker Image
    needs: compile-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/insurance-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=v1.0.${{ github.run_number }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./insurance-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
